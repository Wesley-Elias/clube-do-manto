  <link rel="preconnect" href="https://fonts.googleapis.com">

  <a class="pular" href="#conteudo">Pular para o conteúdo</a>

  <main id="conteudo" class="area-cliente" aria-busy="true" data-c07>

      <div class="area-cliente__topo">
        <a class="area-cliente__voltar" href="kits.html" data-voltar><span aria-hidden="true">←</span>Voltar ao kit</a>

        <section class="cartao cartao--estado" aria-live="polite">
          <span class="chip chip--neutro"><span aria-hidden="true">…</span>Consulta em andamento</span>
