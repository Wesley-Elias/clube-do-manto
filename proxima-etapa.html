<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Próxima etapa · Clube do Manto</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Figtree:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/componentes.css">
  <link rel="stylesheet" href="css/fluxo.css">

<body>
  <header class="cabecalho-fluxo">
    <div class="container cabecalho-fluxo__interno">
      <a class="logo" href="index.html"><span class="logo__marca" aria-hidden="true">///</span>Clube do Manto</a>
      <button class="botao botao--sec-escuro" type="button" data-sair hidden>Sair</button>

  </header>

  <!-- Página provisória da implementação: marca onde as próximas telas vão entrar.
       Não é uma tela do produto e some quando a tela correspondente for construída. -->
  <main class="proxima" id="conteudo">
    <div class="container">
      <section class="cartao-form" aria-labelledby="titulo-proxima">
        <span class="codigo-tela" data-codigo></span>
        <h1 class="cartao-form__titulo" id="titulo-proxima" data-titulo>Próxima etapa</h1>
        <p class="lead">Esta tela entra na próxima etapa da implementação. O contexto abaixo foi preservado até aqui.</p>
        <ul class="lista-proximos" data-detalhes></ul>
        <div class="proxima__acoes">
          <a class="botao botao--primaria" href="index.html">Voltar ao início</a>
        </div>
      </section>
    </div>
  </main>
</body>
</html>
